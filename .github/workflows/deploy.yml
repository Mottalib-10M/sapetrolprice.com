name: CEF and SARB update and deploy

# Du lundi au vendredi vers 16 h 30 (heure d'Afrique du Sud) : scripts/data/build-cef.py --auto relit la liste
# des communiqués mensuels et des fiches quotidiennes du prix de base (Basic Fuel Price) du Central Energy Fund,
# et scripts/data/build-sarb.py les taux de la SARB ; src/data/cef.json et sarb.json sont réécrits, puis le site
# est reconstruit et publié. La CEF publie une fiche chaque jour ouvré (avec un ou deux jours de décalage) et un
# communiqué avant chaque changement mensuel (premier mercredi du mois). Une fiche ou un communiqué postérieur
# à WINDOW_END_ASSUMED (src/lib/engine/fuel.ts) n'est pas pris : le passage au mois suivant reste une relecture
# humaine (constantes et texte), signalée par un avertissement dans le journal du workflow.
# Ce workflow est le seul qui publie le site : push sur main, tâche planifiée et lancement manuel.
# Modèle : canadaprocessingtimes.com/.github/workflows/update-data.yml (RECETTE, sites à données datées).
on:
  schedule:
    - cron: "30 14 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        if: github.event_name != 'push'
        run: pip install pypdf

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Read the CEF and SARB figures (scheduled and manual runs)
        if: github.event_name != 'push'
        run: npm run update-data

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Commit the new readings
        id: commit
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cef.json src/data/sarb.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else
            git commit -m "Chiffres CEF et SARB relus le $(date -u +%F)" && git push && echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout (script IndexNow)
        if: github.event_name != 'schedule' || needs.build.outputs.changed == 'true'
        uses: actions/checkout@v4
      - name: Ping IndexNow
        if: github.event_name != 'schedule' || needs.build.outputs.changed == 'true'
        continue-on-error: true
        run: bash scripts/indexnow.sh https://sapetrolprice.com
